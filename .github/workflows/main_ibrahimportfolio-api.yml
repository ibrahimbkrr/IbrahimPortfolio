name: Build and deploy WebApi - ibrahimportfolio-api

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibrahimportfolio-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WebApi
        run: dotnet restore IbrahimPortfolio.WebApi/IbrahimPortfolio.WebApi.csproj

      - name: Build WebApi
        run: dotnet build IbrahimPortfolio.WebApi/IbrahimPortfolio.WebApi.csproj --configuration Release --no-restore

      - name: Publish WebApi
        run: dotnet publish IbrahimPortfolio.WebApi/IbrahimPortfolio.WebApi.csproj --configuration Release --no-restore --output "${{ github.workspace }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-publish
          path: ${{ github.workspace }}/publish
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-publish
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy WebApi
        uses: azure/webapps-deploy@v3
        with:
          app-name: ibrahimportfolio-api
          slot-name: Production
          package: ./publish
